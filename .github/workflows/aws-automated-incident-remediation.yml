#
name: Git-driven ECS Fargate delivery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ecs-platform-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: "us-east-1"
  TF_CLOUD_ORGANIZATION: "DigitalTech"
  TF_WORKSPACE: "aws-ecs-fargate-automated-deployment"
  # These defaults match the Terraform defaults. Override with repository variables
  # if env_prefix or the ECS resource names differ in the HCP Terraform workspace.
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'prod-web-app' }}
  ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME || 'prod-cluster' }}
  ECS_SERVICE_NAME: ${{ vars.ECS_SERVICE_NAME || 'prod-web-app' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - run: python -m unittest discover -s tests -v
      - name: Build website container (no push)
        run: docker build --pull -t local-web-app:ci .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Initialize HCP Terraform workspace
        run: terraform init

      # ECR must exist before Docker can push. Create only the ECR resources first;
      # the complete application stack is applied after the image is available.
      - name: Bootstrap ECR repository with Terraform
        run: |
          terraform apply -auto-approve \
            -target=aws_ecr_repository.app \
            -target=aws_ecr_lifecycle_policy.app

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push initial bootstrap image if absent
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          if aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag=bootstrap >/dev/null 2>&1; then
            echo "Immutable bootstrap image already exists; leaving it unchanged."
          else
            docker build --pull -t "$REGISTRY/$ECR_REPOSITORY:bootstrap" .
            docker push "$REGISTRY/$ECR_REPOSITORY:bootstrap"
          fi

      - name: Build and push commit-specific immutable image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: git-${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --pull -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Plan and apply full infrastructure with this commit's image
        env:
          TF_VAR_image_tag: git-${{ github.sha }}
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          terraform validate
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan

      - name: Verify ECS deployment stability
        run: |
          set -euo pipefail
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_SERVICE_NAME"
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_SERVICE_NAME" \
            --query 'services[0].{status:status,running:runningCount,desired:desiredCount,deployments:deployments[*].rolloutState}' \
            --output table
