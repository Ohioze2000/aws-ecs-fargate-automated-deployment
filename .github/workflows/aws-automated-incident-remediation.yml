name: Git-driven ECS Fargate delivery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ecs-platform-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_CLOUD_ORGANIZATION: DigitalTech
  TF_WORKSPACE: aws-ecs-fargate-automated-deployment
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  validate:
    name: Validate Terraform and application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      # --- PIPELINE INITIALIZATION SLACK ALERT ---
      - name: Slack Notification - Started
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: 'good'
          SLACK_TITLE: "Infrastructure Pipeline Status: STARTED"
          SLACK_MESSAGE: "🚀 Triggered native Terraform Cloud remote run execution."    

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform init -backend=false

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Build website container without pushing
        run: docker build --pull -t local-web-app:ci .

  deploy:
    name: Deploy ECS Fargate infrastructure
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity and discover account
        shell: bash
        run: |
          set -euo pipefail

          AWS_ACCOUNT_ID="$(aws sts get-caller-identity \
            --query Account \
            --output text)"

          if [[ ! "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::Could not determine a valid AWS account ID."
            exit 1
          fi

          echo "AWS account discovered successfully."
          echo "AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Initialize HCP Terraform workspace
        run: terraform init

      # ECR must exist before Docker can push the application image.
      # The ECR resources are defined inside module.ecr in root main.tf.
      - name: Bootstrap ECR repository with Terraform
        shell: bash
        run: |
          set -euo pipefail

          terraform apply -auto-approve \
            -target=module.ecr.aws_ecr_repository.app \
            -target=module.ecr.aws_ecr_lifecycle_policy.app

      # These outputs must be exposed by the root Terraform configuration.
      - name: Discover Terraform-managed resource names
        shell: bash
        run: |
          set -euo pipefail

          ECR_REPOSITORY="$(terraform output -raw ecr_repository_name)"
          ECR_REPOSITORY_URL="$(terraform output -raw ecr_repository_url)"
          ECS_CLUSTER_NAME="$(terraform output -raw ecs_cluster_name)"
          ECS_SERVICE_NAME="$(terraform output -raw ecs_service_name)"

          for value in \
            "$ECR_REPOSITORY" \
            "$ECR_REPOSITORY_URL" \
            "$ECS_CLUSTER_NAME" \
            "$ECS_SERVICE_NAME"; do
            if [[ -z "$value" ]]; then
              echo "::error::A required Terraform output is empty."
              exit 1
            fi
          done

          # Ensure the ECR URL points to the AWS account authenticated above.
          EXPECTED_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          if [[ "$ECR_REPOSITORY_URL" != "$EXPECTED_REGISTRY/"* ]]; then
            echo "::error::The Terraform ECR URL does not match the authenticated AWS account and region."
            exit 1
          fi

          echo "ECR_REPOSITORY=$ECR_REPOSITORY" >> "$GITHUB_ENV"
          echo "ECR_REPOSITORY_URL=$ECR_REPOSITORY_URL" >> "$GITHUB_ENV"
          echo "ECS_CLUSTER_NAME=$ECS_CLUSTER_NAME" >> "$GITHUB_ENV"
          echo "ECS_SERVICE_NAME=$ECS_SERVICE_NAME" >> "$GITHUB_ENV"

          echo "Terraform resource names discovered successfully."

      - name: Verify ECR repository exists
        shell: bash
        run: |
          set -euo pipefail

          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --query 'repositories[0].{name:repositoryName,uri:repositoryUri}' \
            --output table

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The bootstrap tag is immutable. Only create it when it does not exist.
      - name: Build and push bootstrap image if absent
        shell: bash
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail

          if aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag=bootstrap \
              --region "$AWS_REGION" >/dev/null 2>&1; then

            echo "The immutable bootstrap image already exists."
            echo "Skipping bootstrap image push."
          else
            docker build --pull \
              -t "$REGISTRY/$ECR_REPOSITORY:bootstrap" .

            docker push "$REGISTRY/$ECR_REPOSITORY:bootstrap"
          fi

      # A unique commit-based tag supports immutable ECR repositories.
      - name: Build and push commit-specific image
        shell: bash
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: git-${{ github.sha }}
        run: |
          set -euo pipefail

          # Skip an image already pushed by an earlier run of this commit.
          if aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=$IMAGE_TAG" \
              --region "$AWS_REGION" >/dev/null 2>&1; then

            echo "Image $IMAGE_TAG already exists; skipping push."
          else
            docker build --pull \
              -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .

            docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          fi

      - name: Validate and apply full infrastructure
        shell: bash
        env:
          TF_VAR_image_tag: git-${{ github.sha }}
        run: |
          set -euo pipefail

          terraform fmt -check -recursive
          terraform validate

          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan

      - name: Verify ECS deployment stability
        shell: bash
        run: |
          set -euo pipefail

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_SERVICE_NAME" \
            --region "$AWS_REGION"

          aws ecs describe-services \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_SERVICE_NAME" \
            --region "$AWS_REGION" \
            --query 'services[0].{
              clusterArn:clusterArn,
              serviceName:serviceName,
              status:status,
              running:runningCount,
              desired:desiredCount,
              pending:pendingCount,
              deployments:deployments[*].rolloutState
            }' \
            --output json

       # --- SUCCESS NOTIFICATION ---        
      - name: Slack Notification - Success
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: 'good'
          SLACK_TITLE: "✅ Deployment SUCCESSFUL"
          SLACK_MESSAGE: "Your changes are live at: ${{ steps.vars.outputs.URL }}"

       # --- FAILURE NOTIFICATION ---
      - name: Slack Notification - Failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: 'danger'
          SLACK_MESSAGE: "❌ Deployment FAILED. Check GitHub Actions logs."
          SLACK_TITLE: "Deployment Status: FAILED"     
