#
name: Git-driven ECS Fargate delivery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ecs-fargate-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_CLOUD_ORGANIZATION: DigitalTech
  TF_WORKSPACE: aws-ecs-fargate-automated-deployment
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_EC2_METADATA_DISABLED: "true"

jobs:

  # --------------------------------------------------
  # JOB 1: VALIDATION
  # --------------------------------------------------

  validate:
    name: Validate Terraform and application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform init -backend=false

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Build website container without pushing
        run: docker build --pull -t local-web-app:ci .


  # --------------------------------------------------
  # JOB 2: DEPLOYMENT
  # --------------------------------------------------

  deploy:
    name: Deploy ECS Fargate infrastructure

    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')

    needs: validate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      # --------------------------------------------------
      # PIPELINE START NOTIFICATION
      # --------------------------------------------------

      - name: Slack Notification - Started
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: good
          SLACK_TITLE: ECS Fargate Deployment Started
          SLACK_MESSAGE: >-
            🚀 Starting infrastructure deployment for commit
            ${{ github.sha }}.

      # --------------------------------------------------
      # AWS AUTHENTICATION
      # --------------------------------------------------

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity and discover account
        shell: bash
        run: |
          set -euo pipefail

          aws sts get-caller-identity

          AWS_ACCOUNT_ID="$(aws sts get-caller-identity \
            --query Account \
            --output text)"

          if [[ ! "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::Invalid AWS account ID."
            exit 1
          fi

          echo "AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # HCP TERRAFORM INITIALIZATION
      # --------------------------------------------------

      - name: Initialize HCP Terraform workspace
        run: terraform init

      - name: Verify HCP Terraform workspace
        shell: bash
        run: |
          set -euo pipefail

          ACTIVE_WORKSPACE="$(terraform workspace show)"

          echo "Expected workspace: $TF_WORKSPACE"
          echo "Active workspace: $ACTIVE_WORKSPACE"

          if [[ "$ACTIVE_WORKSPACE" != "$TF_WORKSPACE" ]]; then
            echo "::error::Incorrect HCP Terraform workspace."
            exit 1
          fi

          echo "HCP Terraform workspace verified."

      # --------------------------------------------------
      # ECR BOOTSTRAP
      # --------------------------------------------------

      - name: Bootstrap ECR repository with Terraform
        shell: bash
        run: |
          set -euo pipefail

          terraform apply -input=false -auto-approve \
            -target=module.ecr.aws_ecr_repository.app \
            -target=module.ecr.aws_ecr_lifecycle_policy.app

          echo "ECR bootstrap completed."

      - name: Discover ECR repository from Terraform
        shell: bash
        run: |
          set -euo pipefail

          ECR_REPOSITORY="$(terraform output -raw ecr_repository_name)"
          ECR_REPOSITORY_URL="$(terraform output -raw ecr_repository_url)"

          if [[ -z "$ECR_REPOSITORY" || -z "$ECR_REPOSITORY_URL" ]]; then
            echo "::error::ECR Terraform outputs are missing."
            exit 1
          fi

          EXPECTED_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          if [[ "$ECR_REPOSITORY_URL" != "$EXPECTED_REGISTRY/"* ]]; then
            echo "::error::ECR URL does not match the authenticated AWS account and region."
            exit 1
          fi

          echo "ECR_REPOSITORY=$ECR_REPOSITORY" >> "$GITHUB_ENV"
          echo "ECR_REPOSITORY_URL=$ECR_REPOSITORY_URL" >> "$GITHUB_ENV"

          echo "ECR repository discovered successfully."

      - name: Verify ECR repository exists
        run: |
          set -euo pipefail

          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION"

      # --------------------------------------------------
      # DOCKER BUILD AND PUSH
      # --------------------------------------------------

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push commit-specific image
        shell: bash
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: git-${{ github.sha }}
        run: |
          set -euo pipefail

          if aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=$IMAGE_TAG" \
              --region "$AWS_REGION" >/dev/null 2>&1; then

            echo "Image $IMAGE_TAG already exists."
            echo "Skipping image push."

          else

            docker build --pull \
              -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" ./app

            docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          fi

      # --------------------------------------------------
      # FULL INFRASTRUCTURE DEPLOYMENT
      # --------------------------------------------------

      - name: Terraform Plan
        shell: bash
        env:
          TF_VAR_image_tag: git-${{ github.sha }}
        run: |
          set -euo pipefail

          terraform fmt -check -recursive
          terraform validate

          terraform plan -input=false

      - name: Terraform Apply
        shell: bash
        env:
          TF_VAR_image_tag: git-${{ github.sha }}
        run: |
          set -euo pipefail

          terraform apply -input=false -auto-approve

          echo "Full Terraform apply completed successfully."

      # --------------------------------------------------
      # ECS OUTPUT DISCOVERY
      # --------------------------------------------------

      - name: Discover ECS outputs after full apply
        shell: bash
        run: |
          set -euo pipefail

          ECS_CLUSTER_NAME="$(terraform output -raw ecs_cluster_name)"
          ECS_SERVICE_NAME="$(terraform output -raw ecs_service_name)"
          APPLICATION_URL="$(terraform output -raw application_url)"

          for value in \
            "$ECS_CLUSTER_NAME" \
            "$ECS_SERVICE_NAME" \
            "$APPLICATION_URL"; do

            if [[ -z "$value" ]]; then
              echo "::error::A required Terraform output is empty."
              exit 1
            fi

          done

          echo "ECS_CLUSTER_NAME=$ECS_CLUSTER_NAME" >> "$GITHUB_ENV"
          echo "ECS_SERVICE_NAME=$ECS_SERVICE_NAME" >> "$GITHUB_ENV"
          echo "APPLICATION_URL=$APPLICATION_URL" >> "$GITHUB_ENV"

          echo "ECS outputs discovered successfully."

      # --------------------------------------------------
      # ECS DEPLOYMENT VERIFICATION
      # --------------------------------------------------

      - name: Wait for ECS deployment stability
        shell: bash
        run: |
          set -euo pipefail

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_SERVICE_NAME" \
            --region "$AWS_REGION"

      - name: Verify ECS service state
        shell: bash
        run: |
          set -euo pipefail

          aws ecs describe-services \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_SERVICE_NAME" \
            --region "$AWS_REGION" \
            --query 'services[0].{
              serviceName:serviceName,
              status:status,
              running:runningCount,
              desired:desiredCount,
              pending:pendingCount,
              deployments:deployments[*].rolloutState
            }' \
            --output json

      # --------------------------------------------------
      # CAPTURE APPLICATION URL
      # --------------------------------------------------

      - name: Capture application URL
        id: website
        shell: bash
        run: |
          set -euo pipefail

          echo "url=$APPLICATION_URL" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # SLACK SUCCESS NOTIFICATION
      # --------------------------------------------------

      - name: Slack Notification - Success
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: good
          SLACK_TITLE: ECS Fargate Deployment Successful
          SLACK_MESSAGE: >-
            ✅ Deployment completed successfully.
            Commit: ${{ github.sha }}
            Application: ${{ steps.website.outputs.url }}

      # --------------------------------------------------
      # SLACK FAILURE NOTIFICATION
      # --------------------------------------------------

      - name: Slack Notification - Failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: danger
          SLACK_TITLE: ECS Fargate Deployment Failed
          SLACK_MESSAGE: >-
            ❌ Deployment failed for commit ${{ github.sha }}.
            Check GitHub Actions logs for the failed step.
